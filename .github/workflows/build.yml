
name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            platforms;android-35
            build-tools;34.0.0
            build-tools;35.0.0

      - name: Setup Gradle fallback
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Locate and extract project
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          zips=( *.zip )

          for zipfile in "${zips[@]}"; do
            echo "Extracting: $zipfile"
            unzip -o "$zipfile" -d extracted
          done

          SETTINGS=$(find . \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './.git/*' \
            -not -path './.gradle/*' \
            | head -n 1 || true)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            echo "Check whether the Android project files were uploaded."
            find . -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          echo "Java version:"
          java -version

          echo "Android SDK: $ANDROID_HOME"
          echo "Project files:"
          ls -la

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "Gradle Wrapper missing; using installed Gradle."
            gradle --no-daemon assembleDebug
          fi

          echo "Searching for APK..."
          find . -type f -path "*/build/outputs/apk/debug/*.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nfc-tag-emulator-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
