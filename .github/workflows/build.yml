
name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. 取得儲存庫
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 設定 Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. 尋找 Android SDK
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK directory not found."
            exit 1
          fi

          SDKMANAGER="$(
            find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print -quit 2>/dev/null || true
          )"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            find "$ANDROID_HOME" -maxdepth 5 \
              -name sdkmanager -print || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Android SDK: $ANDROID_HOME"
          echo "SDK Manager: $SDKMANAGER"

      # 4. 安裝 Android SDK 套件
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" --install "platform-tools"
          "$SDKMANAGER" --install "platforms;android-34"
          "$SDKMANAGER" --install "platforms;android-35"
          "$SDKMANAGER" --install "build-tools;34.0.0"
          "$SDKMANAGER" --install "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/platforms/android-35"

          echo "Android SDK packages installed."

      # 5. 設定 Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # 6. 解壓並檢查 ZIP
      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="android-nfc-tag-emulator.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Project ZIP not found."
            find . -maxdepth 4 -type f \
              -not -path './.git/*' || true
            exit 1
          fi

          unzip -t "$ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 8 -type f \
            | head -n 300

      # 7. 尋找真正的 Android 專案根目錄
      - name: Locate Android Project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          SETTINGS="$(
            find extracted \
              -type f \
              \( \
                -name settings.gradle \
                -o \
                -name settings.gradle.kts \
              \) \
              -print -quit
          )"

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS")"
          else
            APP_BUILD="$(
              find extracted \
                -type f \
                \( \
                  -path '*/app/build.gradle' \
                  -o \
                  -path '*/app/build.gradle.kts' \
                \) \
                -print -quit
            )"

            if [ -z "$APP_BUILD" ]; then
              echo "::error::No app/build.gradle or app/build.gradle.kts found."
              find extracted -maxdepth 10 -type f \
                | head -n 300
              exit 1
            fi

            APP_DIR="$(dirname "$APP_BUILD")"
            PROJECT_DIR="$(dirname "$APP_DIR")"
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::App module build file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project root: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      # 8. 補上缺少的根目錄 Gradle 設定
      - name: Repair Missing Gradle Root Files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          # 若 ZIP 沒有 settings.gradle.kts，
          # 建立標準 Android 單模組專案設定。
          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then

            echo "Creating settings.gradle.kts"

            cat > settings.gradle.kts <<'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NfcTagEmulator"
          include(":app")
          GRADLE
          fi

          # 若缺少根目錄 build.gradle.kts，
          # 建立最小根目錄設定。
          if [ ! -f "build.gradle" ] && \
             [ ! -f "build.gradle.kts" ]; then

            echo "Creating root build.gradle.kts"

            cat > build.gradle.kts <<'GRADLE'
          // Android plugin versions are defined by the app
          // module or the version catalog when applicable.
          GRADLE
          fi

          # 確保 app 模組存在
          if [ ! -d "app" ]; then
            echo "::error::App module directory is missing."
            exit 1
          fi

          # 確認版本目錄是否存在
          if [ -f "gradle/libs.versions.toml" ]; then
            echo "Version catalog found."
          else
            echo "No Gradle version catalog found."
          fi

          # 設定 Android SDK 路徑
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "Root Gradle files:"
          ls -la

      # 9. 編譯前檢查
      - name: Validate Android Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "::error::Gradle settings file missing."
            exit 1
          fi

          if [ ! -f "build.gradle" ] && \
             [ ! -f "build.gradle.kts" ]; then
            echo "::error::Root build file missing."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "::error::App build file missing."
            exit 1
          fi

          echo "Project structure:"
          find . -maxdepth 5 -type f \
            -not -path './.gradle/*' \
            | head -n 200

      # 10. 編譯 Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          java -version
          gradle --version

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

          echo "Generated APK files:"
          find . \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print

      # 11. 上傳 APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nfc-tag-emulator-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
