name: Build Android APK
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK with Gradle
        run: |
          # 若有 zip 檔則自動解壓縮
          if ls *.zip 1> /dev/null 2>&1; then
            echo "解壓縮專案包..."
            unzip -o *.zip
          fi

          # 自動定位包含 settings.gradle.kts 的專案目錄
          PROJECT_DIR="."
          if [ -f "android/settings.gradle.kts" ]; then
            PROJECT_DIR="android"
          elif [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            FOUND=$(find . -name "settings.gradle.kts" -not -path "*/.*" | head -n 1)
            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
            fi
          fi

          echo "專案目錄為: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 執行 Android APK 編譯
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfc-tag-emulator-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
