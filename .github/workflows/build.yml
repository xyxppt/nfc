name: Build Android APK
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-levels: '34'
          build-tools: '34.0.0'
          cmdline-tools: 'latest'
          components: 'platform-tools'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK with Gradle
        shell: bash
        run: |
          set -e

          if ls *.zip 1>/dev/null 2>&1; then
            echo "發現 zip 壓縮包，正在解壓縮..."
            unzip -o *.zip
          fi

          PROJECT_DIR="."
          if [ -f "android/settings.gradle.kts" ]; then
            PROJECT_DIR="android"
          elif [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            FOUND=$(find . -name "settings.gradle.kts" -not -path "*/.*" | head -n 1)
            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
            fi
          fi

          echo "進入 Android 專案路徑: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties
          yes | sdkmanager --licenses || true

          gradle assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfc-tag-emulator-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
