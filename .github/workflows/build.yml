
name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. 取得 GitHub 儲存庫
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 設定 Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. 尋找 Android SDK
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK directory not found."
            exit 1
          fi

          SDKMANAGER="$(
            find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print -quit 2>/dev/null || true
          )"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            find "$ANDROID_HOME" -maxdepth 6 \
              -name sdkmanager -print || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Android SDK: $ANDROID_HOME"
          echo "SDK Manager: $SDKMANAGER"

      # 4. 安裝 Android SDK 套件
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" --install "platform-tools"
          "$SDKMANAGER" --install "platforms;android-34"
          "$SDKMANAGER" --install "platforms;android-35"
          "$SDKMANAGER" --install "build-tools;34.0.0"
          "$SDKMANAGER" --install "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Android SDK verification passed."

      # 5. 設定 Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # 6. 解壓 Android 專案
      - name: Extract Android Project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="android-nfc-tag-emulator.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Project ZIP not found."
            exit 1
          fi

          unzip -t "$ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted project files:"
          find extracted -maxdepth 10 -type f \
            | head -n 300

      # 7. 定位 Android 專案
      - name: Locate Android Project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          SETTINGS="$(
            find extracted -type f \
              \( \
                -name settings.gradle \
                -o \
                -name settings.gradle.kts \
              \) -print -quit
          )"

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS")"
          else
            APP_BUILD="$(
              find extracted -type f \
                \( \
                  -path '*/app/build.gradle' \
                  -o \
                  -path '*/app/build.gradle.kts' \
                \) -print -quit
            )"

            if [ -z "$APP_BUILD" ]; then
              echo "::error::App Gradle file not found."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$(dirname "$APP_BUILD")")"
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::App module build file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"

      # 8. 修補缺少的 Gradle 根目錄設定
      - name: Repair Missing Gradle Root Files
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            cat > settings.gradle.kts <<'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NfcTagEmulator"
          include(":app")
          GRADLE
          fi

          if [ ! -f build.gradle ] && \
             [ ! -f build.gradle.kts ]; then
            cat > build.gradle.kts <<'GRADLE'
          // App module configuration is defined in app/build.gradle.kts.
          GRADLE
          fi

          if [ ! -d app ]; then
            echo "::error::App directory not found."
            exit 1
          fi

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "Gradle root files:"
          ls -la

      # 9. 修正這次真正的錯誤：補齊 Android 資源
      - name: Ensure Required Android Resources
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR" <<'PYTHON'
          import os
          import sys
          import xml.etree.ElementTree as ET

          project = sys.argv[1]
          values_dir = os.path.join(
              project, "app", "src", "main", "res", "values"
          )
          os.makedirs(values_dir, exist_ok=True)

          def ensure_resource(filename, tag, name, attributes, value=None):
              path = os.path.join(values_dir, filename)

              if os.path.exists(path):
                  tree = ET.parse(path)
                  root = tree.getroot()
              else:
                  root = ET.Element("resources")
                  tree = ET.ElementTree(root)

              found = any(
                  item.tag == tag and item.get("name") == name
                  for item in root
              )

              if not found:
                  item = ET.SubElement(root, tag, attributes)
                  if value is not None:
                      item.text = value

              tree.write(
                  path,
                  encoding="utf-8",
                  xml_declaration=True
              )
              print(f"Verified resource: {filename} / {name}")

          ensure_resource(
              "strings.xml",
              "string",
              "app_name",
              {},
              "NFC Tag Emulator"
          )

          ensure_resource(
              "styles.xml",
              "style",
              "Theme.NfcTagEmulator",
              {"parent": "@android:style/Theme.Material.Light.NoActionBar"}
          )
          PYTHON

          echo "Required Android resources are ready."

      # 10. 驗證專案
      - name: Validate Android Project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/values/strings.xml
          test -f app/src/main/res/values/styles.xml

          if [ ! -f settings.gradle ] && \
             [ ! -f settings.gradle.kts ]; then
            echo "::error::Gradle settings file missing."
            exit 1
          fi

          if [ ! -f app/build.gradle ] && \
             [ ! -f app/build.gradle.kts ]; then
            echo "::error::App build file missing."
            exit 1
          fi

          echo "Project validation passed."

      # 11. 編譯 Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          java -version
          gradle --version

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

          APK_COUNT="$(
            find . -type f \
              -path '*/build/outputs/apk/debug/*.apk' \
              | wc -l
          )"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::Build completed but no debug APK was found."
            exit 1
          fi

          echo "Generated APK files:"
          find . -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print

      # 12. 上傳 APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nfc-tag-emulator-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
