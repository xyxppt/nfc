
name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. 下載 GitHub 儲存庫
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 設定 Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. 設定 Android SDK 工具
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      # 4. 逐個安裝 Android SDK 套件
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager -print -quit || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "::error::Cannot find Android sdkmanager."
            find "$ANDROID_HOME" -maxdepth 5 -type f \
              -name sdkmanager || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install "platform-tools"
          "$SDKMANAGER" --install "platforms;android-34"
          "$SDKMANAGER" --install "build-tools;34.0.0"

          echo "Android SDK packages installed successfully."

      # 5. 設定 Gradle 備援版本
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # 6. 解壓 ZIP 並尋找 Android 專案
      - name: Locate and extract project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          echo "=================================="
          echo "Repository files"
          echo "=================================="

          find . -maxdepth 4 -type f \
            -not -path './.git/*' \
            | head -n 150

          echo "=================================="
          echo "Extract ZIP files"
          echo "=================================="

          while IFS= read -r -d '' zipfile; do
            echo "Extracting: $zipfile"
            unzip -o "$zipfile" -d extracted
          done < <(
            find . \
              -maxdepth 2 \
              -type f \
              -name '*.zip' \
              -not -path './.git/*' \
              -not -path './extracted/*' \
              -print0
          )

          echo "=================================="
          echo "Find Gradle settings"
          echo "=================================="

          SETTINGS="$(
            find . \
              -type f \
              \( \
                -name settings.gradle \
                -o \
                -name settings.gradle.kts \
              \) \
              -not -path './.git/*' \
              -not -path './.gradle/*' \
              | head -n 1 || true
          )"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Gradle settings file not found."
            echo "Android project files after extraction:"

            find extracted \
              -maxdepth 8 \
              -type f \
              | head -n 250 || true

            echo "ZIP files:"
            find . -maxdepth 3 -type f \
              -name '*.zip' -print

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "Found settings file: $SETTINGS"
          echo "Project directory: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project root contents:"
          ls -la "$PROJECT_DIR"

      # 7. 檢查 Android 專案是否完整
      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Checking project structure..."

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "::error::Gradle settings file is missing."
            exit 1
          fi

          if [ ! -f "build.gradle" ] && \
             [ ! -f "build.gradle.kts" ]; then
            echo "::error::Root Gradle build file is missing."
            ls -la
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "::error::App directory is missing."
            find . -maxdepth 4 -type f | head -n 200
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "::error::App Gradle build file is missing."
            exit 1
          fi

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "Android project structure looks valid."

      # 8. 編譯 Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=================================="
          echo "Java version"
          echo "=================================="

          java -version

          echo "=================================="
          echo "Android SDK"
          echo "=================================="

          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "=================================="
          echo "Build APK"
          echo "=================================="

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "Gradle Wrapper not found."

            if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
              echo "::error::Gradle Wrapper configuration exists, but gradlew is missing."
              exit 1
            fi

            gradle --no-daemon assembleDebug
          fi

          echo "=================================="
          echo "Find generated APK"
          echo "=================================="

          find . \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print

      # 9. 上傳 APK 成品
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nfc-tag-emulator-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
