
name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. 取得儲存庫
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 設定 Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. 設定 Android SDK 工具
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      # 4. 安裝 Android SDK 套件
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install "platform-tools"
          "$SDKMANAGER" --install "platforms;android-34"
          "$SDKMANAGER" --install "build-tools;34.0.0"

          echo "SDK installation completed."

      # 5. 檢查 ZIP 並顯示內部檔案
      - name: Inspect and Extract Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          ZIP_FILE="android-nfc-tag-emulator.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP file not found: $ZIP_FILE"
            echo "Repository files:"
            find . -maxdepth 4 -type f \
              -not -path './.git/*' | head -n 200
            exit 1
          fi

          echo "=================================="
          echo "Check ZIP integrity"
          echo "=================================="

          unzip -t "$ZIP_FILE"

          echo "=================================="
          echo "ZIP internal file list"
          echo "=================================="

          unzip -Z1 "$ZIP_FILE" | head -n 250

          echo "=================================="
          echo "Extract ZIP"
          echo "=================================="

          unzip -o "$ZIP_FILE" -d extracted

          echo "=================================="
          echo "Extracted file list"
          echo "=================================="

          find extracted -maxdepth 8 -type f \
            | head -n 300

      # 6. 自動尋找 Android 專案根目錄
      - name: Locate Android Project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(
            find extracted \
              -type f \
              \( \
                -name settings.gradle \
                -o \
                -name settings.gradle.kts \
              \) \
              -print -quit
          )"

          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts found inside ZIP."
            echo "The ZIP may not contain a complete Gradle Android project."
            echo "Inspect the file list in the previous step."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "Found settings file: $SETTINGS"
          echo "Project root: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project root contents:"
          ls -la "$PROJECT_DIR"

      # 7. 驗證專案結構
      - name: Validate Android Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f "build.gradle" ] && \
             [ ! -f "build.gradle.kts" ]; then
            echo "::error::Root build.gradle file not found."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "::error::The app directory is missing."
            find . -maxdepth 5 -type f | head -n 200
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle file not found."
            exit 1
          fi

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "Project structure validated."

      # 8. 編譯 APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          java -version

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "Gradle Wrapper not found; using installed Gradle."
            gradle --no-daemon assembleDebug
          fi

          echo "=================================="
          echo "Generated APK files"
          echo "=================================="

          find . \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print

      # 9. 上傳 APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nfc-tag-emulator-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
