
name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. 取得 GitHub 儲存庫
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 設定 Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. 檢查執行環境內的 Android SDK
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK directory not found."
            exit 1
          fi

          SDKMANAGER="$(
            find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print -quit 2>/dev/null || true
          )"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found in preinstalled SDK."
            find "$ANDROID_HOME" -maxdepth 5 -type f \
              -name sdkmanager || true
            exit 1
          fi

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "sdkmanager: $SDKMANAGER"
          java -version
          "$SDKMANAGER" --version

      # 4. 接受授權並逐個安裝 SDK 套件
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses || true

          echo "Updating SDK package metadata..."
          "$SDKMANAGER" --list

          echo "Installing platform-tools..."
          "$SDKMANAGER" --install "platform-tools"

          echo "Installing Android API 34..."
          "$SDKMANAGER" --install "platforms;android-34"

          echo "Installing Build Tools 34..."
          "$SDKMANAGER" --install "build-tools;34.0.0"

          echo "Installing Android API 35..."
          "$SDKMANAGER" --install "platforms;android-35"

          echo "Installing Build Tools 35..."
          "$SDKMANAGER" --install "build-tools;35.0.0"

          echo "Verifying installed packages..."
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"

          echo "Android SDK installation completed."

      # 5. 設定 Gradle 備援版本
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # 6. 檢查並解壓 Android 專案 ZIP
      - name: Inspect and Extract Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="android-nfc-tag-emulator.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Project ZIP not found: $ZIP_FILE"
            find . -maxdepth 5 -type f \
              -not -path './.git/*' || true
            exit 1
          fi

          echo "Checking ZIP integrity..."
          unzip -t "$ZIP_FILE"

          echo "ZIP contents:"
          unzip -Z1 "$ZIP_FILE" | head -n 300

          mkdir -p extracted

          echo "Extracting Android project..."
          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 8 -type f \
            | head -n 300

      # 7. 尋找 Android 專案根目錄
      - name: Locate Android Project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(
            find extracted \
              -type f \
              \( \
                -name settings.gradle \
                -o \
                -name settings.gradle.kts \
              \) \
              -print -quit
          )"

          if [ -z "$SETTINGS" ]; then
            echo "::error::No Gradle settings file found in ZIP."
            echo "The ZIP may not contain a complete Android project."
            echo "Extracted file list:"
            find extracted -maxdepth 8 -type f \
              | head -n 300 || true
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "Found settings file: $SETTINGS"
          echo "Project directory: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project root:"
          ls -la "$PROJECT_DIR"

      # 8. 驗證 Android 專案結構
      - name: Validate Android Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ ! -f "build.gradle" ] && \
             [ ! -f "build.gradle.kts" ]; then
            echo "::error::Root Gradle build file is missing."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "::error::The app directory is missing."
            find . -maxdepth 5 -type f | head -n 200
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "::error::App Gradle build file is missing."
            exit 1
          fi

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "Android project structure validated."

      # 9. 編譯 Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Java version:"
          java -version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          if [ -f "./gradlew" ]; then
            echo "Using project Gradle Wrapper."
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
              echo "::error::Gradle Wrapper configuration exists, but gradlew is missing."
              exit 1
            fi

            echo "Using installed Gradle."
            gradle --no-daemon assembleDebug
          fi

          echo "Searching for APK..."

          find . \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print

      # 10. 上傳 APK 成品
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nfc-tag-emulator-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
