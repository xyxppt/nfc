name: Build Android APK
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK with Gradle
        run: |
          # 1. 自動解開 zip 專案包
          if ls *.zip 1> /dev/null 2>&1; then
            echo "發現 zip 壓縮包，正在解壓縮..."
            unzip -o *.zip
          fi

          # 2. 自動尋找包含 settings.gradle.kts 的目錄
          PROJECT_DIR="."
          if [ -f "android/settings.gradle.kts" ]; then
            PROJECT_DIR="android"
          elif [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          else
            FOUND=$(find . -name "settings.gradle.kts" -not -path "*/.*" | head -n 1)
            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
            fi
          fi

          echo "進入 Android 專案路徑: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 3. 注入 Android SDK 本地路徑並同意授權
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | sdkmanager --licenses 2>/dev/null || true

          # 4. 執行打包 APK (移除干擾視線的過長 stacktrace)
          gradle assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfc-tag-emulator-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
