
name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. 下載 GitHub 儲存庫內容
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 設定 Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. 安裝 Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
          accept-android-sdk-licenses: true

      # 4. 設定 Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # 5. 解壓 ZIP 並尋找 Android 專案
      - name: Locate and extract project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          echo "=================================="
          echo "Repository files"
          echo "=================================="

          find . -maxdepth 4 -type f \
            -not -path './.git/*' \
            | head -n 150

          echo "=================================="
          echo "Extract ZIP files"
          echo "=================================="

          while IFS= read -r -d '' zipfile; do
            echo "Extracting: $zipfile"
            unzip -o "$zipfile" -d extracted
          done < <(
            find . \
              -maxdepth 2 \
              -type f \
              -name '*.zip' \
              -not -path './extracted/*' \
              -not -path './.git/*' \
              -print0
          )

          echo "=================================="
          echo "Search Gradle settings"
          echo "=================================="

          SETTINGS="$(
            find . \
              -type f \
              \( \
                -name settings.gradle \
                -o \
                -name settings.gradle.kts \
              \) \
              -not -path './.git/*' \
              -not -path './.gradle/*' \
              | head -n 1 || true
          )"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Android project settings file not found."
            echo "Expected settings.gradle or settings.gradle.kts."
            echo "Files found after extraction:"

            find extracted \
              -maxdepth 8 \
              -type f \
              | head -n 250 || true

            echo "ZIP file contents:"
            find . \
              -maxdepth 2 \
              -type f \
              -name '*.zip' \
              -print

            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "Settings file: $SETTINGS"
          echo "Project directory: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=================================="
          echo "Project root files"
          echo "=================================="

          ls -la "$PROJECT_DIR"

      # 6. 檢查專案結構
      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Checking Android project structure..."

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "::error::Gradle settings file is missing."
            exit 1
          fi

          if [ ! -f "build.gradle" ] && \
             [ ! -f "build.gradle.kts" ]; then
            echo "::error::Root build.gradle file is missing."
            echo "The project may have an incomplete structure."
            ls -la
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "::error::The app directory was not found."
            echo "Project files:"
            find . -maxdepth 4 -type f | head -n 200
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "::error::App Gradle build file is missing."
            exit 1
          fi

          echo "Project structure looks valid."

          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 7. 建置 Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=================================="
          echo "Java version"
          echo "=================================="

          java -version

          echo "=================================="
          echo "Android SDK"
          echo "=================================="

          echo "ANDROID_HOME=$ANDROID_HOME"

          echo "=================================="
          echo "Gradle build"
          echo "=================================="

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "Gradle Wrapper not found."

            if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
              echo "Wrapper configuration exists but gradlew is missing."
              echo "::error::Restore the Gradle Wrapper files."
              exit 1
            fi

            echo "Using installed Gradle 8.10.2."
            gradle --no-daemon assembleDebug
          fi

          echo "=================================="
          echo "Search generated APK"
          echo "=================================="

          find . \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print

      # 8. 上傳 APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nfc-tag-emulator-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
